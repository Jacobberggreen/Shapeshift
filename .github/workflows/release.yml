name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/build-app.sh
      - name: Build disk image
        run: scripts/make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Shapeshift.dmg --clobber
          else
            gh release create "$TAG" build/Shapeshift.dmg --title "Shapeshift ${TAG#v}" --generate-notes
          fi
